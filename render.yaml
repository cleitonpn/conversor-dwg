services:
  - type: web
    name: conversor-dwg-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://cleitonpn.github.io
      - key: MAX_UPLOAD_MB
        value: "100"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dwg-to-glb"
version = "0.1.0"
description = "Conversor web local de arquivos DWG 3D para GLB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "ezdxf>=1.4,<2",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

